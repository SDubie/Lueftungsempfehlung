repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-all
        name: pytest all tests
        entry: .venv/Scripts/python.exe -m pytest tests
        language: system
        pass_filenames: false
        stages: [pre-push]
